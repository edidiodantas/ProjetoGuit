<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPEIA VIBE CODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="app-header-inner">
                <h1>IPEIA VIBE CODE</h1>
                <p>Cole seu código, peça ao Kimi/Moonshot para melhorá-lo e revise o diff (diferença entre o original e a sugestão).</p>
            </div>
        </header>

        <section class="controls" aria-label="Configuração da construção">
            <form id="composeForm" class="controls-form" novalidate>
                <div class="control-group language-group">
                    <label for="language">Linguagem</label>
                    <select id="language" name="language">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="json">JSON</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="go">Go</option>
                    </select>
                </div>

                <div class="control-group prompt-group">
                    <label for="prompt">Prompt</label>
                    <textarea
                        id="prompt"
                        name="prompt"
                        rows="2"
                        placeholder="ex.: Adicione tratamento de erros"
                    ></textarea>
                </div>

                <div class="control-group buttons">
                    <button id="composeBtn" type="submit" class="primary">
                        <span class="btn-text">Construir</span>
                        <span class="btn-spinner" aria-hidden="true"></span>
                    </button>
                    <button id="resetBtn" type="button" class="secondary">Redefinir</button>
                </div>
            </form>

            <div
                id="status"
                class="status"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            ></div>
        </section>

        <main>
            <section class="editor-section" aria-label="Editor original">
                <div class="section-header">
                    <h2>Original</h2>
                    <span class="section-hint">Código enviado à IA</span>
                </div>
                <div class="editor-wrapper">
                    <div id="originalEditor" class="editor"></div>
                </div>
            </section>

            <section class="editor-section diff-section" aria-label="Diferença proposta">
                <div class="section-header">
                    <h2>Diferença</h2>
                    <span class="section-hint">Alterações sugeridas</span>
                </div>
                <div class="editor-wrapper">
                    <div id="diffEditor" class="editor"></div>
                    <div id="diffEmptyState" class="empty-state">
                        <div class="empty-state-icon" aria-hidden="true">✨</div>
                        <p class="empty-state-title">Nenhuma sugestão ainda</p>
                        <p class="empty-state-description">
                            Preencha o prompt e clique em <strong>Construir</strong>.
                        </p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
