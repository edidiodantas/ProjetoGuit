<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi Vibe Composer</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Kimi Vibe Composer</h1>
            <p>Paste your code, ask Kimi/Moonshot to improve it, and review the diff.</p>
        </header>

        <main>
            <section class="controls">
                <label class="language-label">
                    Language
                    <select id="language">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="json">JSON</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="go">Go</option>
                    </select>
                </label>

                <label class="prompt-label">
                    Prompt
                    <textarea
                        id="prompt"
                        rows="3"
                        placeholder="e.g., Add error handling and type hints"
                    ></textarea>
                </label>

                <div class="buttons">
                    <button id="composeBtn" type="button">Compose</button>
                    <button id="resetBtn" type="button" class="secondary">Reset</button>
                </div>

                <div id="status" class="status" aria-live="polite"></div>
            </section>

            <section class="editor-section">
                <h2>Original</h2>
                <div id="originalEditor" class="editor"></div>
            </section>

            <section class="editor-section diff-section">
                <h2>Diff</h2>
                <div id="diffEditor" class="editor"></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
