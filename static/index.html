<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPEIA_VIBE_CODE</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>IPEIA_VIBE_CODE</h1>
            <p>Cole seu código, peça ao Kimi/Moonshot para melhorá-lo e revise o diff.</p>
        </header>

        <main>
            <section class="controls">
                <label class="language-label">
                    Linguagem
                    <select id="language">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="json">JSON</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="go">Go</option>
                    </select>
                </label>

                <label class="prompt-label">
                    Prompt
                    <textarea
                        id="prompt"
                        rows="3"
                        placeholder="ex.: Adicione tratamento de erros e anotações de tipo"
                    ></textarea>
                </label>

                <div class="buttons">
                    <button id="composeBtn" type="button">Compor</button>
                    <button id="resetBtn" type="button" class="secondary">Redefinir</button>
                </div>

                <div id="status" class="status" aria-live="polite"></div>
            </section>

            <section class="editor-section">
                <h2>Original</h2>
                <div id="originalEditor" class="editor"></div>
            </section>

            <section class="editor-section diff-section">
                <h2>Diferença</h2>
                <div id="diffEditor" class="editor"></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
