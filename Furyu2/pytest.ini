[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --cov=academic_search --cov-report=term-missing --cov-fail-under=100
markers =
    slow: testes que demoram ou usam rede real (desativados por padrão)
    ssrf_dns: usa resolução DNS real na validação anti-SSRF

[coverage:run]
source = academic_search
branch = True
omit =
    app.py
    test_keys.py

[coverage:report]
fail_under = 100
show_missing = True
skip_covered = False
