<svg class="furyu-mark" width="140" height="92" viewBox="0 0 140 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro aberto com páginas coloridas">
  <defs>
    <linearGradient id="coverL" x1="4" y1="40" x2="66" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E5A7A"/>
      <stop offset="1" stop-color="#062F42"/>
    </linearGradient>
    <linearGradient id="coverR" x1="74" y1="36" x2="136" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B7A9E"/>
      <stop offset="1" stop-color="#0B4F6C"/>
    </linearGradient>
    <linearGradient id="creamL" x1="18" y1="28" x2="68" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F0E2D0"/>
    </linearGradient>
    <linearGradient id="creamR" x1="72" y1="26" x2="122" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F0E2D0"/>
    </linearGradient>
    <linearGradient id="edgeL" x1="10" y1="50" x2="28" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E05E"/>
      <stop offset="35%" stop-color="#F0A03A"/>
      <stop offset="65%" stop-color="#E85A5A"/>
      <stop offset="100%" stop-color="#C848A0"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="112" y1="48" x2="130" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A48E0"/>
      <stop offset="35%" stop-color="#3A7AE8"/>
      <stop offset="65%" stop-color="#2AB8E0"/>
      <stop offset="100%" stop-color="#6AD85A"/>
    </linearGradient>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.3" flood-color="#0B4F6C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="70" cy="86" rx="52" ry="5" fill="#0B4F6C" opacity="0.15"/>

  <g filter="url(#soft)">
    <!-- capas -->
    <path d="M6 44 L66 34 L68 80 L10 86 Z" fill="url(#coverL)"/>
    <path d="M6 44 L10 40 L70 30 L66 34 Z" fill="#0A455E"/>
    <path d="M6 44 L10 86 L14 87 L10 46 Z" fill="#041C28"/>

    <path d="M74 32 L134 40 L130 84 L72 78 Z" fill="url(#coverR)"/>
    <path d="M74 32 L78 28 L138 36 L134 40 Z" fill="#1B7A9E"/>
    <path d="M134 40 L138 36 L134 80 L130 84 Z" fill="#083D54"/>

    <!-- bloco de bordas coloridas (espessura do papel) — esquerdo -->
    <path d="M12 46 C16 42 22 39 28 37 L32 77 C26 79 18 82 14 84 Z" fill="url(#edgeL)"/>
    <!-- linhas finas = folhas -->
    <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7">
      <path d="M16 45 L20 81"/>
      <path d="M20 43 L24 79"/>
      <path d="M24 41 L28 78"/>
    </g>

    <!-- bloco de bordas coloridas — direito -->
    <path d="M128 42 C124 38 118 35 112 34 L108 76 C114 78 122 80 126 82 Z" fill="url(#edgeR)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7">
      <path d="M124 41 L120 79"/>
      <path d="M120 39 L116 77"/>
      <path d="M116 37 L112 76"/>
    </g>

    <!-- PÁGINAS CREME (maior parte = parece livro) -->
    <path d="M30 36 C46 32 58 31 68 32 L70 76 C56 78 42 80 32 78 Z" fill="url(#creamL)"/>
    <path d="M72 31 C84 30 98 31 110 34 L108 76 C96 78 84 77 70 75.5 Z" fill="url(#creamR)"/>

    <!-- texto -->
    <path d="M38 46h22M38 52h20M39 58h18M40 64h16"
          stroke="#0B4F6C" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M80 44h22M80 50h20M81 56h18M82 62h16"
          stroke="#0B4F6C" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round"/>

    <!-- lombada -->
    <path d="M66 30 L70 26 L76 27 L74 76 L68 77.5 L64 33 Z" fill="#041C28"/>
    <path d="M69 28 L73 27.5" stroke="#D7EEF5" stroke-width="1.1" opacity="0.5"/>
    <path d="M69 16 L71 29 L72.5 16.5 Z" fill="#E84870"/>
  </g>
</svg>
