<svg class="furyu-mark" width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro aberto isométrico flat">
  <!--
    Livro aberto, perspectiva isométrica, deitado flat.
    Contorno minimalista + linhas fluidas = folhas (não texto).
  -->
  <defs>
    <linearGradient id="pgL" x1="24" y1="78" x2="96" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6D35A"/>
      <stop offset="55%" stop-color="#F08A45"/>
      <stop offset="100%" stop-color="#E4577A"/>
    </linearGradient>
    <linearGradient id="pgR" x1="104" y1="40" x2="176" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A5CE8"/>
      <stop offset="50%" stop-color="#3B8FE8"/>
      <stop offset="100%" stop-color="#3DD4A0"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="108" rx="58" ry="6" fill="#0B4F6C" opacity="0.11"/>

  <!-- capas / páginas isométricas -->
  <path fill="#F08A45" d="M26 64 L90 34 L100 78 L36 98 Z"/>
  <path fill="url(#pgL)" opacity="0.9" d="M26 64 L90 34 L100 78 L36 98 Z"/>
  <path fill="#3B8FE8" d="M110 34 L174 64 L164 98 L100 78 Z"/>
  <path fill="url(#pgR)" opacity="0.9" d="M110 34 L174 64 L164 98 L100 78 Z"/>

  <!-- miolo creme (leitura) -->
  <path fill="#FFFCFA" opacity="0.84" d="M40 68 L86 44 L94 74 L48 92 Z"/>
  <path fill="#FFFCFA" opacity="0.84" d="M114 44 L160 68 L152 92 L106 74 Z"/>

  <!-- contorno minimalista -->
  <path fill="none" stroke="#0B4F6C" stroke-width="2.75"
        stroke-linecap="round" stroke-linejoin="round"
        d="M26 64
           L90 34
           L100 42
           L110 34
           L174 64
           L164 98
           L100 86
           L36 98
           Z"/>

  <!-- lombada -->
  <path fill="none" stroke="#0B4F6C" stroke-width="2.45" stroke-linecap="round"
        d="M100 42 L100 86"/>

  <!-- espessura inferior (flat no chão) -->
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.32" stroke-width="1.45"
        stroke-linecap="round"
        d="M36 98 L40 102 L100 90 L160 102 L164 98"/>

  <!--
    Folhas fluidas: arcos longos no plano isométrico,
    da lombada até a borda — leem como páginas, não linhas de texto.
  -->
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.40" stroke-width="1.35" stroke-linecap="round"
        d="M97 50 C74 46, 50 56, 32 72"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.30" stroke-width="1.2" stroke-linecap="round"
        d="M97 62 C72 60, 48 68, 34 84"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.22" stroke-width="1.1" stroke-linecap="round"
        d="M97 74 C74 74, 52 80, 40 94"/>

  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.40" stroke-width="1.35" stroke-linecap="round"
        d="M103 50 C126 46, 150 56, 168 72"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.30" stroke-width="1.2" stroke-linecap="round"
        d="M103 62 C128 60, 152 68, 166 84"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.22" stroke-width="1.1" stroke-linecap="round"
        d="M103 74 C126 74, 148 80, 160 94"/>
</svg>
