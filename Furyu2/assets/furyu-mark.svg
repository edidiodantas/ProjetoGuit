<svg class="furyu-mark" width="128" height="72" viewBox="0 0 128 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro aberto deitado">
  <defs>
    <linearGradient id="coverL" x1="4" y1="16" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E5A7A"/>
      <stop offset="1" stop-color="#062F42"/>
    </linearGradient>
    <linearGradient id="coverR" x1="68" y1="12" x2="124" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A97BC"/>
      <stop offset="1" stop-color="#0B4F6C"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F2E6D6"/>
    </linearGradient>
    <filter id="soft" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#0B4F6C" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- sombra sob o livro deitado -->
  <ellipse cx="64" cy="64" rx="52" ry="5" fill="#0B4F6C" opacity="0.15"/>

  <g filter="url(#soft)">
    <!--
      Vista de cima: livro ABERTO e DEITADO na mesa.
      Formato largo e baixo; páginas coloridas nas bordas laterais.
    -->

    <!-- CAPA ESQUERDA (retângulo deitado, leve perspectiva) -->
    <path d="M62 18 L6 22 L8 52 L62 46 Z" fill="url(#coverL)"/>
    <!-- espessura inferior da capa -->
    <path d="M6 22 L8 52 L12 54 L10 24 Z" fill="#041C28"/>
    <path d="M62 46 L8 52 L12 54 L62 48 Z" fill="#031820"/>

    <!-- CAPA DIREITA -->
    <path d="M66 16 L122 12 L124 42 L66 44 Z" fill="url(#coverR)"/>
    <path d="M122 12 L124 42 L120 44 L118 14 Z" fill="#083D54"/>
    <path d="M66 44 L124 42 L120 44 L66 46 Z" fill="#052636"/>

    <!-- FAIXAS DE PÁGINAS COLORIDAS — ESQUERDA (borda externa) -->
    <path d="M61 19 L10 22.8 L11.6 50.5 L61 45.2 Z" fill="#F07167"/>
    <path d="M61 20.2 L14 23.6 L15.4 49.6 L61 44.6 Z" fill="#E8B86D"/>
    <path d="M61 21.4 L18 24.4 L19.2 48.7 L61 44 Z" fill="#6FBF9A"/>
    <path d="M61 22.6 L22 25.2 L23 47.8 L61 43.4 Z" fill="#5BA4C9"/>
    <path d="M61 23.8 L26 26 L26.8 46.9 L61 42.8 Z" fill="url(#cream)"/>

    <!-- FAIXAS DE PÁGINAS COLORIDAS — DIREITA -->
    <path d="M67 17 L118 13.2 L119.6 41 L67 42.8 Z" fill="#F07167"/>
    <path d="M67 18.2 L114 14.2 L115.6 41.2 L67 42.2 Z" fill="#E8B86D"/>
    <path d="M67 19.4 L110 15.2 L111.6 41.4 L67 41.6 Z" fill="#6FBF9A"/>
    <path d="M67 20.6 L106 16.2 L107.6 41.6 L67 41 Z" fill="#5BA4C9"/>
    <path d="M67 21.8 L102 17.2 L103.6 41.8 L67 40.4 Z" fill="url(#cream)"/>

    <!-- linhas de texto nas páginas cream -->
    <path d="M72 24h22M72 28h20M72 32h18M72 36h14"
          stroke="#0B4F6C" stroke-width="1.15" stroke-linecap="round" opacity="0.3"/>
    <path d="M32 28h16M32 32h14M32 36h12M32 40h10"
          stroke="#0B4F6C" stroke-width="1.1" stroke-linecap="round" opacity="0.28"/>

    <!-- lombada central (vinco do livro deitado) -->
    <path d="M60 17.5 L64 14.5 L70 14 L68 44.5 L62 45.5 L58 19 Z" fill="#041C28"/>
    <path d="M63 16 L67 15.5" stroke="#D7EEF5" stroke-width="1.1" opacity="0.5"/>

    <!-- marcador coral -->
    <path d="M63 8 L65 20 L66.5 8.5 Z" fill="#F07167"/>
  </g>
</svg>
