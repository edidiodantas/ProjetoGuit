<svg class="furyu-mark" width="168" height="100" viewBox="0 0 168 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro deitado aberto em traço contínuo">
  <!--
    Silhueta linear (one-line): livro DEITADO, páginas abertas.
    Visual clean — páginas coloridas em destaque + um traço contínuo.
  -->
  <defs>
    <linearGradient id="leafL" x1="14" y1="58" x2="78" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6D35A"/>
      <stop offset="50%" stop-color="#F08A45"/>
      <stop offset="100%" stop-color="#E4577A"/>
    </linearGradient>
    <linearGradient id="leafR" x1="90" y1="30" x2="154" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A5CE8"/>
      <stop offset="45%" stop-color="#3B8FE8"/>
      <stop offset="100%" stop-color="#3DD4A0"/>
    </linearGradient>
  </defs>

  <!-- Páginas coloridas abertas (destaque) -->
  <path fill="url(#leafL)" opacity="0.95"
        d="M18 56
           C22 34, 42 22, 70 26
           C78 28, 82 36, 84 48
           L82 66
           C58 72, 32 70, 18 56 Z"/>
  <path fill="url(#leafR)" opacity="0.95"
        d="M84 48
           C86 36, 90 28, 98 26
           C126 22, 146 34, 150 56
           C136 70, 110 72, 86 66
           L84 48 Z"/>

  <!-- Folha de leitura (creme) — limpa, sem texto -->
  <path fill="#FFFCFA" opacity="0.72"
        d="M32 52 C38 38, 52 30, 72 32 L76 58 C56 62, 40 60, 32 52 Z"/>
  <path fill="#FFFCFA" opacity="0.72"
        d="M92 32 C112 30, 128 38, 136 52 C128 60, 112 62, 92 58 L92 32 Z"/>

  <!--
    ONE-LINE contínuo:
    começa na ponta esquerda da capa, sobe pelo arco das páginas esquerdas,
    desce no vale da lombada, sobe nas páginas direitas, desce a capa direita,
    volta pela base e fecha no ponto inicial — um único path.
  -->
  <path
    fill="none"
    stroke="#0B4F6C"
    stroke-width="2.85"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M 16 58
       C 14 40, 28 24, 52 22
       C 66 20, 76 26, 82 40
       C 84 46, 84 54, 84 62
       C 84 54, 84 46, 86 40
       C 92 26, 102 20, 116 22
       C 140 24, 154 40, 152 58
       C 150 70, 136 78, 116 80
       C 102 82, 92 78, 86 70
       C 84 66, 84 64, 84 62
       C 84 64, 84 66, 82 70
       C 76 78, 66 82, 52 80
       C 32 78, 18 70, 16 58
       Z"/>

  <!-- Sulco da lombada (mesmo traço, como continuação do one-line no centro) -->
  <path fill="none" stroke="#0B4F6C" stroke-width="2.5" stroke-linecap="round"
        d="M84 28 C84 40, 84 52, 84 74"/>

  <!-- Linhas de página — traço fino, limpo -->
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.26" stroke-width="1.15" stroke-linecap="round"
        d="M34 50 C46 38, 58 32, 74 34"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.2" stroke-width="1.05" stroke-linecap="round"
        d="M36 58 C48 48, 60 42, 76 44"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.26" stroke-width="1.15" stroke-linecap="round"
        d="M94 34 C110 32, 122 38, 134 50"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.2" stroke-width="1.05" stroke-linecap="round"
        d="M92 44 C108 42, 120 48, 132 58"/>
</svg>
