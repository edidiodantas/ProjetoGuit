<svg class="furyu-mark" width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro aberto">
  <defs>
    <linearGradient id="cL" x1="4" y1="50" x2="42" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E5A7A"/>
      <stop offset="1" stop-color="#052636"/>
    </linearGradient>
    <linearGradient id="cR" x1="48" y1="20" x2="94" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3AA6C9"/>
      <stop offset="1" stop-color="#0B4F6C"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFCF7"/>
      <stop offset="1" stop-color="#EAD9C4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#0B4F6C" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- sombra no chão -->
  <ellipse cx="54" cy="87" rx="38" ry="5" fill="#0B4F6C" opacity="0.16" transform="rotate(-22 54 87)"/>

  <g filter="url(#glow)">
    <!--
      Vista 3/4 de cima, livro bem aberto e inclinado:
      a direita mostra um leque largo das páginas coloridas.
    -->

    <!-- ===== CAPA ESQUERDA (quase perfil) ===== -->
    <path d="M40 40 L12 52 L18 84 L44 70 Z" fill="url(#cL)"/>
    <path d="M40 40 L46 34 L16 46 L12 52 Z" fill="#0A455E"/>
    <path d="M12 52 L16 46 L22 78 L18 84 Z" fill="#041C28"/>

    <!-- ===== CAPA DIREITA (aberta) ===== -->
    <path d="M52 30 L92 14 L96 52 L54 64 Z" fill="url(#cR)"/>
    <path d="M52 30 L58 24 L96 8 L92 14 Z" fill="#1B7A9E"/>
    <path d="M92 14 L96 8 L100 46 L96 52 Z" fill="#083D54"/>

    <!-- ===== PÁGINAS ESQUERDA — fatias coloridas (bordas) ===== -->
    <path d="M41 41.5 L16 52.5 L21 81 L43.5 69.2 Z" fill="#F07167"/>
    <path d="M41.6 42.8 L19 53.2 L23.2 80 L43.9 68.8 Z" fill="#E8B86D"/>
    <path d="M42.2 44.1 L22 54 L25.4 79 L44.3 68.4 Z" fill="#6FBF9A"/>
    <path d="M42.8 45.4 L25 54.8 L27.6 78 L44.7 68 Z" fill="#5BA4C9"/>
    <path d="M43.4 46.7 L28 55.6 L29.8 77 L45.1 67.6 Z" fill="url(#cream)"/>

    <!-- ===== PÁGINAS DIREITA — leque largo e bem visível ===== -->
    <!-- coral (mais externa) -->
    <path d="M53 32 L88 17.5 L92 53 L54.5 63 Z" fill="#F07167"/>
    <!-- ouro -->
    <path d="M53.4 34 L83 20 L87 54 L54.8 62.2 Z" fill="#E8B86D"/>
    <!-- menta -->
    <path d="M53.8 36 L78 23 L82 55 L55.1 61.4 Z" fill="#6FBF9A"/>
    <!-- céu -->
    <path d="M54.2 38 L73 26 L77 56 L55.4 60.6 Z" fill="#5BA4C9"/>
    <!-- cream (página de cima) -->
    <path d="M54.6 40 L68 29 L72 57 L55.7 59.8 Z" fill="url(#cream)"/>

    <!-- topo das páginas (espessura colorida visível no corte superior) -->
    <path d="M53 32 L58 26 L93 11 L88 17.5 Z" fill="#E85A52" opacity="0.9"/>
    <path d="M53.4 34 L57.5 28.5 L88 14.5 L83 20 Z" fill="#D4A04A" opacity="0.95"/>
    <path d="M53.8 36 L57 30.5 L83 17.5 L78 23 Z" fill="#4FA882" opacity="0.95"/>
    <path d="M54.2 38 L56.5 32.5 L78 20.5 L73 26 Z" fill="#3B8BB0" opacity="0.95"/>
    <path d="M54.6 40 L56 34.5 L73 23.5 L68 29 Z" fill="#FFF8EF"/>

    <!-- linhas de texto -->
    <path d="M58 44h11M58 49h10M58 54h8"
          stroke="#0B4F6C" stroke-width="1.3" stroke-linecap="round" opacity="0.36"
          transform="rotate(-14 64 49)"/>
    <path d="M32 56h6M32 61h5M32 66h4"
          stroke="#0B4F6C" stroke-width="1.15" stroke-linecap="round" opacity="0.28"
          transform="rotate(14 35 61)"/>

    <!-- LOMBADA diagonal -->
    <path d="M42 38 L48 28 L56 26 L54 62 L46 66 L40 42 Z" fill="#041C28"/>
    <path d="M47 30 L53 28" stroke="#D7EEF5" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
    <path d="M45.5 48 L51.5 46" stroke="#D7EEF5" stroke-width="1" opacity="0.28"/>

    <!-- marcador -->
    <path d="M49 14 L51.5 33 L53.2 14.8 Z" fill="#F07167"/>
    <path d="M49 14 L53.2 14.8 L51.4 9 Z" fill="#E85A52"/>
  </g>
</svg>
