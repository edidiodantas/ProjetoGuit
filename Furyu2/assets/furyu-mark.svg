<svg class="furyu-mark" width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro aberto">
  <defs>
    <linearGradient id="coverL" x1="8" y1="20" x2="46" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B4F6C"/>
      <stop offset="1" stop-color="#083D54"/>
    </linearGradient>
    <linearGradient id="coverR" x1="50" y1="20" x2="88" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B7A9E"/>
      <stop offset="1" stop-color="#0B4F6C"/>
    </linearGradient>
    <linearGradient id="pageWarm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F3E4D0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0B4F6C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- sombra da base -->
  <ellipse cx="48" cy="86" rx="30" ry="4.5" fill="#0B4F6C" opacity="0.12"/>

  <g filter="url(#softGlow)">
    <!-- capa esquerda -->
    <path d="M46 22 C34 18 18 20 12 24 L12 76 C20 70 34 68 46 72 Z" fill="url(#coverL)"/>
    <!-- capa direita -->
    <path d="M50 22 C62 18 78 20 84 24 L84 76 C76 70 62 68 50 72 Z" fill="url(#coverR)"/>

    <!-- páginas coloridas (esquerda, de trás pra frente) -->
    <path class="page page-coral" d="M46 26 C36 23 24 24 16 28 L17 72 C25 67 36 66 46 70 Z" fill="#F07167" opacity="0.92"/>
    <path class="page page-gold"  d="M46 28 C37 25 26 26 18 30 L19 71 C27 67 37 66 46 69.5 Z" fill="#E8B86D" opacity="0.95"/>
    <path class="page page-mint"  d="M46 30 C38 27 28 28 20 32 L21 70.5 C29 67 38 66 46 69 Z" fill="#6FBF9A" opacity="0.95"/>
    <path class="page page-sky"   d="M46 32 C39 29 30 30 22 34 L23 70 C31 67 39 66.5 46 68.5 Z" fill="#5BA4C9" opacity="0.95"/>
    <path class="page page-cream" d="M46 34 C40 31 32 32 24 36 L25 69.5 C33 67 40 66.5 46 68 Z" fill="url(#pageWarm)"/>

    <!-- páginas coloridas (direita) -->
    <path class="page page-coral" d="M50 26 C60 23 72 24 80 28 L79 72 C71 67 60 66 50 70 Z" fill="#F07167" opacity="0.92"/>
    <path class="page page-gold"  d="M50 28 C59 25 70 26 78 30 L77 71 C69 67 59 66 50 69.5 Z" fill="#E8B86D" opacity="0.95"/>
    <path class="page page-mint"  d="M50 30 C58 27 68 28 76 32 L75 70.5 C67 67 58 66 50 69 Z" fill="#6FBF9A" opacity="0.95"/>
    <path class="page page-sky"   d="M50 32 C57 29 66 30 74 34 L73 70 C65 67 57 66.5 50 68.5 Z" fill="#5BA4C9" opacity="0.95"/>
    <path class="page page-cream" d="M50 34 C56 31 64 32 72 36 L71 69.5 C63 67 56 66.5 50 68 Z" fill="url(#pageWarm)"/>

    <!-- linhas de texto nas páginas internas -->
    <path d="M28 44h12M28 50h10M28 56h8" stroke="#0B4F6C" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
    <path d="M56 44h12M56 50h10M56 56h8" stroke="#0B4F6C" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>

    <!-- lombada / vinco central -->
    <path d="M48 20 V74" stroke="#062F42" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M46 22 C47.2 40 47.2 56 46 72" stroke="#E8F4F8" stroke-width="1.2" opacity="0.35"/>
    <path d="M50 22 C48.8 40 48.8 56 50 72" stroke="#E8F4F8" stroke-width="1.2" opacity="0.35"/>

    <!-- marcador de página colorido -->
    <path class="bookmark" d="M47.2 20 L48 34 L48.8 20" fill="#F07167"/>
  </g>
</svg>
