<svg class="furyu-mark" width="168" height="100" viewBox="0 0 168 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro deitado aberto em traço contínuo">
  <!--
    Silhueta linear (one-line): livro DEITADO, páginas abertas.
    Visual clean — páginas coloridas em destaque + um traço contínuo.
  -->
  <defs>
    <linearGradient id="leafL" x1="14" y1="58" x2="78" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6D35A"/>
      <stop offset="50%" stop-color="#F08A45"/>
      <stop offset="100%" stop-color="#E4577A"/>
    </linearGradient>
    <linearGradient id="leafR" x1="90" y1="30" x2="154" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A5CE8"/>
      <stop offset="45%" stop-color="#3B8FE8"/>
      <stop offset="100%" stop-color="#3DD4A0"/>
    </linearGradient>
  </defs>

  <!-- Páginas coloridas abertas (destaque) — fills sólidos + gradiente -->
  <path fill="#F08A45"
        d="M18 56
           C22 34, 42 22, 70 26
           C78 28, 82 36, 84 48
           L82 66
           C58 72, 32 70, 18 56 Z"/>
  <path fill="url(#leafL)" opacity="0.85"
        d="M18 56
           C22 34, 42 22, 70 26
           C78 28, 82 36, 84 48
           L82 66
           C58 72, 32 70, 18 56 Z"/>
  <path fill="#3B8FE8"
        d="M84 48
           C86 36, 90 28, 98 26
           C126 22, 146 34, 150 56
           C136 70, 110 72, 86 66
           L84 48 Z"/>
  <path fill="url(#leafR)" opacity="0.85"
        d="M84 48
           C86 36, 90 28, 98 26
           C126 22, 146 34, 150 56
           C136 70, 110 72, 86 66
           L84 48 Z"/>

  <!-- Folhas internas coloridas (camadas) -->
  <path fill="#FFE08A" opacity="0.55"
        d="M28 54 C34 40, 50 30, 72 33 L76 56 C54 60, 36 58, 28 54 Z"/>
  <path fill="#A8D4FF" opacity="0.5"
        d="M92 33 C114 30, 130 40, 140 54 C132 58, 114 60, 92 56 L92 33 Z"/>

  <!-- Área de leitura creme (clean) -->
  <path fill="#FFFCFA" opacity="0.78"
        d="M36 50 C42 38, 54 32, 72 34 L76 56 C56 60, 42 58, 36 50 Z"/>
  <path fill="#FFFCFA" opacity="0.78"
        d="M92 34 C110 32, 124 38, 132 50 C124 58, 110 60, 92 56 L92 34 Z"/>

  <!--
    ONE-LINE contínuo: capa esq. → páginas → lombada → páginas dir. → capa dir. → base → fecha.
  -->
  <path
    fill="none"
    stroke="#0B4F6C"
    stroke-width="2.85"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M 16 58
       C 14 40, 28 24, 52 22
       C 66 20, 76 26, 82 40
       C 84 46, 84 54, 84 62
       C 84 54, 84 46, 86 40
       C 92 26, 102 20, 116 22
       C 140 24, 154 40, 152 58
       C 150 70, 136 78, 116 80
       C 102 82, 92 78, 86 70
       C 84 66, 84 64, 84 62
       C 84 64, 84 66, 82 70
       C 76 78, 66 82, 52 80
       C 32 78, 18 70, 16 58
       Z"/>

  <path fill="none" stroke="#0B4F6C" stroke-width="2.5" stroke-linecap="round"
        d="M84 28 C84 40, 84 52, 84 74"/>

  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.3" stroke-width="1.15" stroke-linecap="round"
        d="M34 50 C46 38, 58 32, 74 34"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.22" stroke-width="1.05" stroke-linecap="round"
        d="M36 58 C48 48, 60 42, 76 44"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.3" stroke-width="1.15" stroke-linecap="round"
        d="M94 34 C110 32, 122 38, 134 50"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.22" stroke-width="1.05" stroke-linecap="round"
        d="M92 44 C108 42, 120 48, 132 58"/>
</svg>
