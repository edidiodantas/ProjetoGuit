<svg class="furyu-mark" width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furyu — livro aberto isométrico flat">
  <!--
    Ícone: livro aberto em perspectiva isométrica, deitado flat.
    Contorno minimalista + linhas fluidas nas páginas + cores suaves.
    Eixos iso: X ↓→ , Y ↓←  (plano da mesa).
  -->
  <defs>
    <linearGradient id="pgL" x1="24" y1="78" x2="96" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6D35A"/>
      <stop offset="55%" stop-color="#F08A45"/>
      <stop offset="100%" stop-color="#E4577A"/>
    </linearGradient>
    <linearGradient id="pgR" x1="104" y1="40" x2="176" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A5CE8"/>
      <stop offset="50%" stop-color="#3B8FE8"/>
      <stop offset="100%" stop-color="#3DD4A0"/>
    </linearGradient>
  </defs>

  <!-- sombra flat no “chão” -->
  <ellipse cx="100" cy="108" rx="58" ry="6" fill="#0B4F6C" opacity="0.11"/>

  <!--
    Capas isométricas (paralelogramos) — livro deitado, aberto.
    Pontos esq: A(30,62) B(92,36) C(100,78) D(38,96)
    Pontos dir: E(108,36) F(170,62) G(162,96) H(100,78)
  -->
  <path fill="#F08A45" d="M30 62 L92 36 L100 78 L38 96 Z"/>
  <path fill="url(#pgL)" opacity="0.88" d="M30 62 L92 36 L100 78 L38 96 Z"/>
  <path fill="#3B8FE8" d="M108 36 L170 62 L162 96 L100 78 Z"/>
  <path fill="url(#pgR)" opacity="0.88" d="M108 36 L170 62 L162 96 L100 78 Z"/>

  <!-- bloco de páginas (creme) — inset isométrico -->
  <path fill="#FFFCFA" opacity="0.8" d="M42 66 L88 44 L94 74 L48 90 Z"/>
  <path fill="#FFFCFA" opacity="0.8" d="M112 44 L158 66 L152 90 L106 74 Z"/>

  <!-- Contorno minimalista (silhueta isométrica única) -->
  <path fill="none" stroke="#0B4F6C" stroke-width="2.7"
        stroke-linecap="round" stroke-linejoin="round"
        d="M30 62
           L92 36
           L100 44
           L108 36
           L170 62
           L162 96
           L100 86
           L38 96
           Z"/>

  <!-- lombada (vale) -->
  <path fill="none" stroke="#0B4F6C" stroke-width="2.4" stroke-linecap="round"
        d="M100 44 L100 86"/>

  <!-- espessura da capa (aresta inferior isométrica, leve) -->
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.35" stroke-width="1.5"
        stroke-linecap="round"
        d="M38 96 L42 100 L100 90 L158 100 L162 96"/>

  <!--
    Linhas fluidas das páginas — curvas isométricas
    (saem da lombada e acompanham o plano da folha).
  -->
  <!-- esquerda -->
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.42" stroke-width="1.3" stroke-linecap="round"
        d="M96 50 C78 48, 58 56, 40 70"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.34" stroke-width="1.2" stroke-linecap="round"
        d="M96 58 C76 57, 56 64, 40 78"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.26" stroke-width="1.1" stroke-linecap="round"
        d="M96 66 C76 66, 56 72, 42 86"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.18" stroke-width="1" stroke-linecap="round"
        d="M96 74 C78 74, 58 78, 48 90"/>

  <!-- direita -->
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.42" stroke-width="1.3" stroke-linecap="round"
        d="M104 50 C122 48, 142 56, 160 70"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.34" stroke-width="1.2" stroke-linecap="round"
        d="M104 58 C124 57, 144 64, 160 78"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.26" stroke-width="1.1" stroke-linecap="round"
        d="M104 66 C124 66, 144 72, 158 86"/>
  <path fill="none" stroke="#0B4F6C" stroke-opacity="0.18" stroke-width="1" stroke-linecap="round"
        d="M104 74 C122 74, 142 78, 152 90"/>
</svg>
